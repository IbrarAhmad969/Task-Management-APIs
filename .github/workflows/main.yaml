name: Task Management API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          {
            printf 'PORT=%s\n' "$PORT"
            printf 'MONGO_URI=%s\n' "$MONGO_URI"
            printf 'ACCESS_TOKEN_SECRET=%s\n' "$ACCESS_TOKEN_SECRET"
            printf 'ACCESS_TOKEN_EXPIRY=%s\n' "$ACCESS_TOKEN_EXPIRY"
            printf 'REFRESH_TOKEN_SECRET=%s\n' "$REFRESH_TOKEN_SECRET"
            printf 'REFRESH_TOKEN_EXPIRY=%s\n' "$REFRESH_TOKEN_EXPIRY"
          } > .env
          chmod 600 .env
        env:
          PORT: ${{ vars.PORT }}
          MONGO_URI: ${{ vars.MONGO_URI }}
          ACCESS_TOKEN_SECRET: ${{ vars.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ vars.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_SECRET: ${{ vars.REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRY: ${{ vars.REFRESH_TOKEN_EXPIRY }}


  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Change directory
        run: cd Task-Management-APIs

      - name: Install dependencies
        run: npm install
      - name: Create .env file
        run: |
          {
            printf 'PORT=%s\n' "$PORT"
            printf 'MONGO_URI=%s\n' "$MONGO_URI"
            printf 'ACCESS_TOKEN_SECRET=%s\n' "$ACCESS_TOKEN_SECRET"
            printf 'ACCESS_TOKEN_EXPIRY=%s\n' "$ACCESS_TOKEN_EXPIRY"
            printf 'REFRESH_TOKEN_SECRET=%s\n' "$REFRESH_TOKEN_SECRET"
            printf 'REFRESH_TOKEN_EXPIRY=%s\n' "$REFRESH_TOKEN_EXPIRY"
          } > .env
          chmod 600 .env
        env:
          PORT: ${{ vars.PORT }}
          MONGO_URI: ${{ vars.MONGO_URI }}
          ACCESS_TOKEN_SECRET: ${{ vars.ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRY: ${{ vars.ACCESS_TOKEN_EXPIRY }}
          REFRESH_TOKEN_SECRET: ${{ vars.REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRY: ${{ vars.REFRESH_TOKEN_EXPIRY }}
      
      - name: Code Run
        run: npm start
